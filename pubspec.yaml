name: sakina_ac
description: "Sakina Academy"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2 # Ajout du paquet d'icônes Cupertino
  cloud_firestore: ^4.0.0
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.0
  video_player: ^2.8.1
  image_picker: ^1.0.0
  http: ^1.0.0
  path_provider: ^2.0.15
  font_awesome_flutter: ^10.5.0
  just_audio: 0.9.44
  intl_phone_field: 3.2.0
  firebase_storage: 11.6.0
  file_selector: 1.0.3
  uuid: 4.5.1
  url_launcher: 6.3.1

dev_dependencies:
  mockito: ^5.4.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  test: any # Ajout de la dépendance de test manquante

flutter:
  uses-material-design: true

  assets:
    - assets/audios_clean/
    - assets/images/
